spring.application.name=medflow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medflow}
spring.datasource.username=${DB_USER:medflow_user}
spring.datasource.password=${DB_PASSWORD:medflow_dev}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}